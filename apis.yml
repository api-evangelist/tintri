aid: tintri
name: Tintri
description: >-
  Tintri, now part of DDN, builds intelligent enterprise data-management and
  storage infrastructure: the VMstore virtualization-aware storage platform, the
  Tintri Cloud Platform (TCP) and Cloud Engine (TCE), and the Tintri Global
  Center (TGC) management fabric. Tintri exposes a versioned, session-authenticated
  REST API (v310) on every VMstore appliance and TGC instance, letting operators
  automate VM- and virtual-disk-level provisioning, snapshots, replication, QoS,
  alerting, and per-VM analytics. First-party automation ships as a Python SDK
  (PySDK), a PowerShell Automation Toolkit, Ansible playbooks, and Kubernetes CSI
  and OpenStack Cinder storage drivers, all published in the public Tintri GitHub
  organization alongside the REST API reference and code examples.
