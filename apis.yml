apis:
- name: Tintri VMstore REST API
  description: >-
    The Tintri REST API (version v310.91, mapping to TXOS 4.5 and Tintri Global
    Center 4.1+) runs on each VMstore appliance and TGC instance. It is
    session-authenticated (POST /api/v310/session/login with username and
    password returns a JSESSIONID cookie) and exposes VM, virtual-disk,
    datastore, snapshot, replication-link, service-group, alert, appliance,
    licensing, and QoS resources as filterable collections returning JSON.
  humanURL: https://tintri.github.io/tintri-rest-api/index.html
  baseURL: https://{vmstore}/api/v310
  version: v310.91
